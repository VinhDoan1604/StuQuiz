# Lớp giới hạn tần suất thứ 2 ở biên (backend vẫn tự giới hạn theo REDIS_URL)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Khớp MAX_UPLOAD_MB của backend
    client_max_body_size 50m;

    include /etc/nginx/snippets/security-headers.conf;

    limit_req_status 429;

    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://api:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè: nginx là lớp biên, không tin header từ client
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: frontend gọi /api/* (cùng origin => không cần CORS)
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè: nginx là lớp biên, không tin header từ client
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/chat/stream): không buffer, cho phép phản hồi lâu
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
